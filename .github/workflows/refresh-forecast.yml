name: Refresh forecast copy

# Saves an hourly copy of the forecast to forecast.json, which the page falls
# back to when a viewer can't reach Open-Meteo. Triggered hourly by cron-job.org
# (workflow_dispatch); the schedule below is a best-effort backup.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch forecast
        run: node scripts/fetch-forecast.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Refresh forecast copy"
            git push
          fi
